<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Securitas People KYC</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f6f7;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      color: #222;
    }

    .container {
      max-width: 750px;
      margin: 40px auto;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .title {
      text-align: center;
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 24px;
      margin-bottom: 35px;
    }

    .line {
      height: 1px;
      background: #aaa;
      margin-bottom: 30px;
    }

    .heading {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .description {
      text-align: center;
      color: #555;
      font-size: 20px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 18px;
      border: 1px solid #ccc;
      border-radius: 14px;
      font-size: 22px;
      margin-bottom: 25px;
      background: #fff;
    }

    input:focus {
      outline: none;
      border-color: #36c759;
      box-shadow: 0 0 0 3px rgba(54, 199, 89, 0.15);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 18px;
      font-size: 24px;
      font-weight: 700;
      color: white;
      background: #36c759;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      font-size: 20px;
      margin-top: 25px;
      min-height: 30px;
    }

    .success {
      color: #159447;
      font-weight: 700;
    }

    .error {
      color: #d93025;
      font-weight: 700;
    }

    .loading {
      color: #666;
    }

    .result {
      display: none;
      text-align: center;
      margin-top: 30px;
      padding: 25px;
      border-radius: 16px;
      background: #f0fff4;
    }

    .result-title {
      font-size: 26px;
      font-weight: 700;
      color: #159447;
      margin-bottom: 10px;
    }

    .employee-name {
      font-size: 22px;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .container {
        margin: 20px auto;
      }

      .card {
        padding: 25px 20px;
      }

      .title {
        font-size: 32px;
      }

      .subtitle {
        font-size: 20px;
      }

      .heading {
        font-size: 26px;
      }

      .description {
        font-size: 18px;
      }

      label {
        font-size: 19px;
      }

      input {
        font-size: 19px;
      }

      button {
        font-size: 21px;
      }

    }

  </style>
</head>


<body>

  <div class="container">

    <div class="card">

      <div class="title">
        Securitas People
      </div>

      <div class="subtitle">
        Employee Verification
      </div>

      <div class="line"></div>

      <div class="heading">
        🔐 ยืนยันตัวตนพนักงาน
      </div>

      <div class="description">
        กรุณากรอกข้อมูลให้ตรงกับข้อมูลที่ลงทะเบียนไว้กับบริษัท
      </div>


      <!-- Employee ID -->

      <label for="employeeId">
        Employee ID
      </label>

      <input
        id="employeeId"
        type="text"
        placeholder="เช่น TH10200146"
        autocomplete="off"
        autocapitalize="characters"
      >


      <!-- Date of Birth -->

      <label for="dob">
        วันเดือนปีเกิด
      </label>

      <input
        id="dob"
        type="date"
      >


      <!-- Verify Button -->

      <button
        id="verifyButton"
        onclick="verifyEmployee()"
      >
        ยืนยันตัวตน
      </button>


      <!-- Status -->

      <div
        id="status"
        class="status"
      ></div>


      <!-- Result -->

      <div
        id="result"
        class="result"
      >

        <div class="result-title">
          ✅ ยืนยันตัวตนสำเร็จ
        </div>

        <div
          id="employeeName"
          class="employee-name"
        ></div>

      </div>

    </div>

  </div>


<script>

  /*
   * ============================================
   * LIFF
   * ============================================
   */

  const LIFF_ID = "2011060843-6rwH2ZRD";


  /*
   * ============================================
   * GOOGLE APPS SCRIPT API
   * ============================================
   *
   * URL จาก Deployment ของคุณ
   */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzVYalCkM0zX5gV4B9kuQRPOrApCn6wXZnozlkH8waNPVbuaB8uLZNK_4DWhj2hwto/exec";


  /*
   * ============================================
   * เริ่ม LIFF
   * ============================================
   */

  async function initLIFF() {

    try {

      await liff.init({
        liffId: LIFF_ID
      });

      console.log("LIFF initialized");

    } catch (error) {

      console.log("LIFF init error:", error);

    }

  }


  /*
   * ============================================
   * ตรวจสอบพนักงาน
   * ============================================
   */

  function verifyEmployee() {

    const employeeId =
      document
        .getElementById("employeeId")
        .value
        .trim()
        .toUpperCase();


    const dob =
      document
        .getElementById("dob")
        .value
        .trim();


    const button =
      document.getElementById("verifyButton");


    const status =
      document.getElementById("status");


    const result =
      document.getElementById("result");


    const employeeName =
      document.getElementById("employeeName");


    /*
     * Reset
     */

    status.className = "status";

    status.textContent = "";

    result.style.display = "none";


    /*
     * ตรวจ Employee ID
     */

    if (!employeeId) {

      status.className = "status error";

      status.textContent =
        "กรุณากรอก Employee ID";

      return;
    }


    /*
     * ตรวจวันเกิด
     */

    if (!dob) {

      status.className = "status error";

      status.textContent =
        "กรุณาเลือกวันเดือนปีเกิด";

      return;
    }


    /*
     * Loading
     */

    button.disabled = true;

    status.className = "status loading";

    status.textContent =
      "กำลังตรวจสอบข้อมูล...";


    /*
     * แปลงวันเกิด
     *
     * จาก:
     * 1991-07-15
     *
     * เป็น:
     * 15/07/1991
     */

    const dateParts = dob.split("-");

    const year = dateParts[0];

    const month = dateParts[1];

    const day = dateParts[2];

    const formattedDob =
      day + "/" + month + "/" + year;


    /*
     * สร้าง URL
     */

    const url =
      API_URL +
      "?employeeId=" +
      encodeURIComponent(employeeId) +
      "&dob=" +
      encodeURIComponent(formattedDob) +
      "&callback=kycCallback";


    /*
     * JSONP
     */

    window.kycCallback = function(response) {

      button.disabled = false;


      if (response.success) {

        status.className =
          "status success";

        status.textContent =
          response.message;


        employeeName.textContent =
          "ชื่อ: " + response.name;


        result.style.display =
          "block";


      } else {

        status.className =
          "status error";

        status.textContent =
          response.message;

      }


      /*
       * ลบ script หลังใช้งาน
       */

      const scripts =
        document.querySelectorAll(
          'script[data-kyc="true"]'
        );

      scripts.forEach(function(script) {
        script.remove();
      });

    };


    /*
     * เรียก API
     */

    const script =
      document.createElement("script");

    script.src = url;

    script.dataset.kyc = "true";

    script.onerror = function() {

      button.disabled = false;

      status.className =
        "status error";

      status.textContent =
        "ไม่สามารถเชื่อมต่อระบบตรวจสอบได้";

    };


    document.body.appendChild(script);

  }


  /*
   * ============================================
   * กด Enter
   * ============================================
   */

  document
    .getElementById("employeeId")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          verifyEmployee();
        }

      }
    );


  document
    .getElementById("dob")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          verifyEmployee();
        }

      }
    );


  /*
   * ============================================
   * Start LIFF
   * ============================================
   */

  initLIFF();

</script>

</body>
</html>
