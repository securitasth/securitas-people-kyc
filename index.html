<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Securitas People KYC</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;
      padding: 40px 20px;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f5f6f7;

      color: #222;

    }


    .card {

      width: 100%;
      max-width: 1080px;

      margin: 0 auto;

      padding: 42px 50px 55px;

      background: #ffffff;

      border-radius: 24px;

      box-shadow:
        0 5px 25px rgba(0,0,0,0.08);

    }


    .title {

      text-align: center;

      font-size: 58px;

      font-weight: 700;

      margin-bottom: 8px;

    }


    .subtitle {

      text-align: center;

      font-size: 30px;

      color: #667085;

      margin-bottom: 35px;

    }


    .line {

      height: 1px;

      background: #999;

      margin-bottom: 35px;

    }


    .heading {

      text-align: center;

      font-size: 42px;

      font-weight: 700;

      margin-bottom: 25px;

    }


    .description {

      text-align: center;

      font-size: 25px;

      color: #555;

      margin-bottom: 45px;

    }


    label {

      display: block;

      font-size: 30px;

      font-weight: 700;

      margin-bottom: 12px;

    }


    input {

      width: 100%;

      height: 92px;

      padding: 15px 28px;

      margin-bottom: 30px;

      border: 1px solid #c9c9c9;

      border-radius: 18px;

      background: #fff;

      font-size: 30px;

      color: #222;

      outline: none;

    }


    input:focus {

      border-color: #36c94a;

      box-shadow:
        0 0 0 3px rgba(54,201,74,0.12);

    }


    button {

      width: 100%;

      height: 95px;

      border: none;

      border-radius: 18px;

      background: #45c94f;

      color: white;

      font-size: 32px;

      font-weight: 700;

      cursor: pointer;

    }


    button:hover {

      background: #38b943;

    }


    button:disabled {

      background: #aab0b4;

      cursor: not-allowed;

    }


    .status {

      text-align: center;

      font-size: 25px;

      font-weight: 600;

      margin-top: 30px;

      min-height: 35px;

    }


    .result {

      display: none;

      margin-top: 25px;

      padding: 25px;

      text-align: center;

      border-radius: 16px;

      background: #e9f9ec;

      border: 1px solid #6bd276;

    }


    .result-title {

      font-size: 28px;

      font-weight: 700;

      color: #16852a;

      margin-bottom: 10px;

    }


    .employee-name {

      font-size: 30px;

      font-weight: 700;

      color: #222;

    }


    .error {

      color: #d93025;

    }


    .success {

      color: #16852a;

    }


    @media (max-width: 700px) {

      body {

        padding: 15px;

      }


      .card {

        padding: 30px 25px 40px;

        border-radius: 18px;

      }


      .title {

        font-size: 38px;

      }


      .subtitle {

        font-size: 21px;

      }


      .heading {

        font-size: 30px;

      }


      .description {

        font-size: 19px;

        line-height: 1.5;

      }


      label {

        font-size: 23px;

      }


      input {

        height: 70px;

        font-size: 22px;

        padding: 12px 18px;

      }


      button {

        height: 72px;

        font-size: 24px;

      }


      .status {

        font-size: 20px;

      }

    }

  </style>

</head>


<body>


  <div class="card">


    <div class="title">
      Securitas People
    </div>


    <div class="subtitle">
      Employee Verification
    </div>


    <div class="line"></div>


    <div class="heading">
      🔐 ยืนยันตัวตนพนักงาน
    </div>


    <div class="description">
      กรุณากรอกข้อมูลให้ตรงกับข้อมูลที่ลงทะเบียนไว้กับบริษัท
    </div>


    <!-- Employee ID -->

    <label for="employeeId">
      Employee ID
    </label>


    <input
      id="employeeId"
      type="text"
      placeholder="เช่น TH10200146"
      autocomplete="off"
      autocapitalize="characters"
    >


    <!-- Date of Birth -->

    <label for="dob">
      วันเดือนปีเกิด
    </label>


    <input
      id="dob"
      type="date"
    >


    <!-- Verify Button -->

    <button
      id="verifyButton"
      onclick="verifyEmployee()"
    >
      ยืนยันตัวตน / Verify Identity
    </button>


    <!-- Status -->

    <div
      id="status"
      class="status"
    ></div>


    <!-- Result -->

    <div
      id="result"
      class="result"
    >

      <div class="result-title">
        ✅ ยืนยันตัวตนสำเร็จ
      </div>


      <div
        id="employeeName"
        class="employee-name"
      ></div>

    </div>


  </div>


  <script>

    /*
     * Google Apps Script Web App
     *
     * ใช้ URL Deployment ของ Apps Script
     */

    const GOOGLE_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzVYalCkM0zX5gV4B9kuQRPO rApCn6wXZnozlkH8waNPVbuaB8uLZNK_4DWhj2hwto/exec"
      .replace(" ", "");


    /*
     * ตรวจสอบ Employee ID + วันเกิด
     */

    function verifyEmployee() {


      const employeeId =
        document
          .getElementById("employeeId")
          .value
          .trim()
          .toUpperCase();


      const dob =
        document
          .getElementById("dob")
          .value;


      const button =
        document.getElementById("verifyButton");


      const status =
        document.getElementById("status");


      const result =
        document.getElementById("result");


      const employeeName =
        document.getElementById("employeeName");


      /*
       * ล้างผลเดิม
       */

      status.textContent = "";

      status.className = "status";

      result.style.display = "none";

      employeeName.textContent = "";


      /*
       * ตรวจข้อมูลเบื้องต้น
       */

      if (!employeeId) {

        status.textContent =
          "กรุณากรอก Employee ID";

        status.className =
          "status error";

        return;

      }


      if (!dob) {

        status.textContent =
          "กรุณาเลือกวันเดือนปีเกิด";

        status.className =
          "status error";

        return;

      }


      /*
       * ป้องกันการกดซ้ำ
       */

      button.disabled = true;

      button.textContent =
        "กำลังตรวจสอบ...";


      status.textContent =
        "กำลังตรวจสอบข้อมูล...";

      status.className =
        "status";


      /*
       * สร้างชื่อ callback
       */

      const callbackName =
        "kycCallback_" +
        Date.now();


      /*
       * สร้าง function สำหรับรับผลจาก Apps Script
       */

      window[callbackName] =
        function(data) {


          /*
           * ลบ script ที่สร้างขึ้น
           */

          const oldScript =
            document.getElementById(
              "kyc-jsonp"
            );


          if (oldScript) {
            oldScript.remove();
          }


          /*
           * คืนค่าปุ่ม
           */

          button.disabled = false;

          button.textContent =
            "ยืนยันตัวตน / Verify Identity";


          /*
           * ตรวจผล
           */

          if (
            data &&
            data.success === true
          ) {


            status.textContent =
              data.message ||
              "ยืนยันตัวตนสำเร็จ";

            status.className =
              "status success";


            employeeName.textContent =
              data.name
                ? "ชื่อพนักงาน: " + data.name
                : "";


            result.style.display =
              "block";


          } else {


            status.textContent =
              data &&
              data.message
                ? data.message
                : "ไม่สามารถตรวจสอบข้อมูลได้";


            status.className =
              "status error";


          }


          /*
           * ลบ callback
           */

          try {

            delete window[callbackName];

          } catch (e) {

            window[callbackName] =
              undefined;

          }

        };


      /*
       * สร้าง URL สำหรับ JSONP
       */

      const url =
        GOOGLE_SCRIPT_URL +
        "?callback=" +
        encodeURIComponent(callbackName) +
        "&employeeId=" +
        encodeURIComponent(employeeId) +
        "&dob=" +
        encodeURIComponent(dob);


      /*
       * สร้าง script tag
       *
       * วิธีนี้ใช้เรียก Apps Script
       * จาก GitHub Pages โดยไม่ติด CORS
       */

      const script =
        document.createElement("script");


      script.id =
        "kyc-jsonp";


      script.src =
        url;


      /*
       * ถ้าเชื่อมต่อไม่ได้
       */

      script.onerror =
        function() {


          const oldScript =
            document.getElementById(
              "kyc-jsonp"
            );


          if (oldScript) {
            oldScript.remove();
          }


          button.disabled = false;

          button.textContent =
            "ยืนยันตัวตน / Verify Identity";


          status.textContent =
            "ไม่สามารถเชื่อมต่อระบบตรวจสอบได้";


          status.className =
            "status error";


          try {

            delete window[callbackName];

          } catch (e) {

            window[callbackName] =
              undefined;

          }

        };


      /*
       * ส่งคำขอ
       */

      document.body.appendChild(script);

    }

  </script>


</body>

</html>
