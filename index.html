<!DOCTYPE html>
<html lang="th">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Securitas People KYC</title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }


    body {
      font-family:
        Arial,
        "Noto Sans Thai",
        "Tahoma",
        sans-serif;

      background: #f4f6f8;
      color: #222;

      -webkit-font-smoothing: antialiased;
    }


    /* =========================================
       PAGE
    ========================================= */

    .page {
      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding: 24px 16px 40px;
    }


    /* =========================================
       CARD
    ========================================= */

    .card {
      width: 100%;
      max-width: 760px;

      background: #ffffff;

      border-radius: 24px;

      padding: 38px 42px 42px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);
    }


    /* =========================================
       HEADER
    ========================================= */

    .title {
      text-align: center;

      font-size: 46px;
      font-weight: 700;

      line-height: 1.15;

      color: #111;

      margin-bottom: 8px;
    }


    .subtitle {
      text-align: center;

      font-size: 25px;

      line-height: 1.3;

      color: #687386;

      margin-bottom: 28px;
    }


    .line {
      width: 100%;
      height: 1px;

      background: #a8a8a8;

      margin-bottom: 34px;
    }


    /* =========================================
       HEADING
    ========================================= */

    .heading {
      text-align: center;

      font-size: 34px;
      font-weight: 700;

      line-height: 1.3;

      margin-bottom: 18px;

      color: #111;
    }


    .description {
      text-align: center;

      font-size: 21px;

      line-height: 1.55;

      color: #555;

      margin-bottom: 34px;
    }


    /* =========================================
       FORM
    ========================================= */

    .form-group {
      margin-bottom: 24px;
    }


    label {
      display: block;

      font-size: 22px;

      font-weight: 700;

      line-height: 1.3;

      margin-bottom: 10px;

      color: #171717;
    }


    /* =========================================
       INPUT
    ========================================= */

    input {
      display: block;

      width: 100%;

      height: 64px;

      padding: 0 18px;

      border: 1px solid #c9c9c9;

      border-radius: 16px;

      background: #ffffff;

      color: #222;

      font-family: inherit;

      font-size: 20px;

      line-height: 1;

      outline: none;

      -webkit-appearance: none;
      appearance: none;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }


    input::placeholder {
      color: #8a8a8a;
    }


    input:focus {
      border-color: #3bc84a;

      box-shadow:
        0 0 0 3px rgba(59, 200, 74, 0.12);
    }


    /* =========================================
       DATE INPUT
    ========================================= */

    input[type="date"] {
      text-align: left;

      padding-left: 18px;
      padding-right: 14px;

      color: #222;
    }


    /*
      ป้องกัน iPhone บางรุ่นจัดวันที่กึ่งกลาง
      และทำให้ช่องวันเกิดดูสูงเกินไป
    */

    input[type="date"]::-webkit-date-and-time-value {
      text-align: left;
      min-height: 1.2em;
    }


    input[type="date"]::-webkit-calendar-picker-indicator {
      width: 24px;
      height: 24px;

      margin-left: 8px;

      cursor: pointer;

      opacity: 0.9;
    }


    /* =========================================
       BUTTON
    ========================================= */

    #verifyButton {
      width: 100%;

      min-height: 64px;

      margin-top: 6px;

      padding: 12px 18px;

      border: none;

      border-radius: 16px;

      background: #3bc84a;

      color: #ffffff;

      font-family: inherit;

      font-size: 22px;

      font-weight: 700;

      line-height: 1.3;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        transform 0.1s ease,
        background 0.15s ease;
    }


    #verifyButton:hover {
      background: #31b940;
    }


    #verifyButton:active {
      transform: scale(0.99);
    }


    #verifyButton:disabled {
      background: #a8dbaa;

      cursor: wait;

      transform: none;
    }


    /* =========================================
       STATUS
    ========================================= */

    .status {
      display: none;

      text-align: center;

      margin-top: 22px;

      font-size: 20px;

      font-weight: 600;

      line-height: 1.5;
    }


    .status.success {
      display: block;

      color: #168b2c;
    }


    .status.error {
      display: block;

      color: #d92d20;
    }


    .status.loading {
      display: block;

      color: #666;
    }


    /* =========================================
       RESULT
    ========================================= */

    .result {
      display: none;

      margin-top: 26px;

      padding: 26px 20px;

      border: 2px solid #58d36a;

      border-radius: 18px;

      background: #effcf1;

      text-align: center;
    }


    .result.show {
      display: block;
    }


    .result-title {
      font-size: 25px;

      font-weight: 700;

      line-height: 1.4;

      color: #168b2c;

      margin-bottom: 16px;
    }


    .employee-name {
      font-size: 24px;

      font-weight: 700;

      line-height: 1.5;

      color: #222;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      .page {
        padding: 12px 10px 28px;
      }


      .card {
        max-width: 100%;

        padding: 28px 22px 30px;

        border-radius: 20px;
      }


      .title {
        font-size: 34px;
      }


      .subtitle {
        font-size: 20px;

        margin-bottom: 22px;
      }


      .line {
        margin-bottom: 28px;
      }


      .heading {
        font-size: 28px;

        margin-bottom: 14px;
      }


      .description {
        font-size: 18px;

        line-height: 1.5;

        margin-bottom: 28px;
      }


      label {
        font-size: 20px;

        margin-bottom: 9px;
      }


      .form-group {
        margin-bottom: 20px;
      }


      input {
        height: 58px;

        border-radius: 14px;

        padding: 0 16px;

        font-size: 19px;
      }


      input[type="date"] {
        padding-left: 16px;
      }


      input[type="date"]::-webkit-date-and-time-value {
        text-align: left;
      }


      input[type="date"]::-webkit-calendar-picker-indicator {
        width: 22px;
        height: 22px;
      }


      #verifyButton {
        min-height: 58px;

        border-radius: 14px;

        font-size: 20px;

        padding: 10px 14px;
      }


      .status {
        font-size: 18px;

        margin-top: 18px;
      }


      .result {
        margin-top: 22px;

        padding: 22px 16px;
      }


      .result-title {
        font-size: 22px;
      }


      .employee-name {
        font-size: 21px;
      }
    }


    /* =========================================
       SMALL PHONE
    ========================================= */

    @media (max-width: 380px) {

      .card {
        padding-left: 18px;
        padding-right: 18px;
      }


      .title {
        font-size: 30px;
      }


      .subtitle {
        font-size: 18px;
      }


      .heading {
        font-size: 25px;
      }


      .description {
        font-size: 17px;
      }


      label {
        font-size: 19px;
      }


      input {
        height: 56px;

        font-size: 18px;
      }


      #verifyButton {
        min-height: 56px;

        font-size: 18px;
      }
    }

  </style>

</head>


<body>

  <main class="page">

    <section class="card">

      <!-- =====================================
           HEADER
      ====================================== -->

      <div class="title">
        Securitas People
      </div>


      <div class="subtitle">
        Employee Verification
      </div>


      <div class="line"></div>


      <!-- =====================================
           HEADING
      ====================================== -->

      <div class="heading">
        🔐 ยืนยันตัวตนพนักงาน
      </div>


      <div class="description">
        กรุณากรอกข้อมูลให้ตรงกับข้อมูลที่ลงทะเบียนไว้กับบริษัท
      </div>


      <!-- =====================================
           EMPLOYEE ID
      ====================================== -->

      <div class="form-group">

        <label for="employeeId">
          Employee ID
        </label>


        <input
          id="employeeId"
          type="text"
          placeholder="เช่น TH10200146"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
        >

      </div>


      <!-- =====================================
           DATE OF BIRTH
      ====================================== -->

      <div class="form-group">

        <label for="dob">
          วันเดือนปีเกิด
        </label>


        <input
          id="dob"
          type="date"
          autocomplete="bday"
        >

      </div>


      <!-- =====================================
           VERIFY BUTTON
      ====================================== -->

      <button
        id="verifyButton"
        type="button"
        onclick="verifyEmployee()"
      >
        ยืนยันตัวตน / Verify Identity
      </button>


      <!-- =====================================
           STATUS
      ====================================== -->

      <div
        id="status"
        class="status"
      ></div>


      <!-- =====================================
           RESULT
      ====================================== -->

      <div
        id="result"
        class="result"
      >

        <div class="result-title">
          ✅ ยืนยันตัวตนสำเร็จ
        </div>


        <div
          id="employeeName"
          class="employee-name"
        ></div>

      </div>

    </section>

  </main>


  <script>

    /* =========================================
       GOOGLE APPS SCRIPT
    ========================================= */

    const GOOGLE_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbzVYaICkM0zX5gV4B9kuQRPOrApCn6wXZnozIkH8waNPVbuaB8uLZNK_4DWhj2hwto/exec';


    /* =========================================
       ELEMENTS
    ========================================= */

    const employeeIdInput =
      document.getElementById('employeeId');


    const dobInput =
      document.getElementById('dob');


    const verifyButton =
      document.getElementById('verifyButton');


    const statusElement =
      document.getElementById('status');


    const resultElement =
      document.getElementById('result');


    const employeeNameElement =
      document.getElementById('employeeName');


    /* =========================================
       SHOW STATUS
    ========================================= */

    function showStatus(message, type) {

      statusElement.textContent = message;

      statusElement.className =
        'status ' + type;
    }


    /* =========================================
       HIDE RESULT
    ========================================= */

    function hideResult() {

      resultElement.classList.remove('show');

      employeeNameElement.textContent = '';
    }


    /* =========================================
       SHOW RESULT
    ========================================= */

    function showResult(name) {

      employeeNameElement.textContent =
        'ชื่อพนักงาน: ' + name;

      resultElement.classList.add('show');
    }


    /* =========================================
       VERIFY EMPLOYEE
    ========================================= */

    function verifyEmployee() {

      const employeeId =
        employeeIdInput.value
          .trim()
          .toUpperCase();


      const dob =
        dobInput.value.trim();


      hideResult();


      /* -----------------------------------------
         VALIDATE
      ----------------------------------------- */

      if (!employeeId) {

        showStatus(
          'กรุณากรอก Employee ID',
          'error'
        );

        employeeIdInput.focus();

        return;
      }


      if (!dob) {

        showStatus(
          'กรุณาเลือกวันเดือนปีเกิด',
          'error'
        );

        dobInput.focus();

        return;
      }


      /* -----------------------------------------
         LOADING
      ----------------------------------------- */

      verifyButton.disabled = true;

      verifyButton.textContent =
        'กำลังตรวจสอบ...';


      showStatus(
        'กำลังตรวจสอบข้อมูล...',
        'loading'
      );


      /* -----------------------------------------
         JSONP CALLBACK NAME
      ----------------------------------------- */

      const callbackName =
        'kycCallback_' +
        Date.now() +
        '_' +
        Math.floor(Math.random() * 100000);


      /* -----------------------------------------
         CREATE SCRIPT
      ----------------------------------------- */

      const script =
        document.createElement('script');


      /* -----------------------------------------
         CLEANUP
      ----------------------------------------- */

      let finished = false;


      const cleanup = function() {

        if (finished) {
          return;
        }

        finished = true;


        verifyButton.disabled = false;

        verifyButton.textContent =
          'ยืนยันตัวตน / Verify Identity';


        if (script.parentNode) {

          script.parentNode.removeChild(script);
        }


        try {

          delete window[callbackName];

        } catch (error) {

          window[callbackName] =
            undefined;
        }
      };


      /* -----------------------------------------
         SUCCESS CALLBACK
      ----------------------------------------- */

      window[callbackName] =
        function(data) {

          cleanup();


          if (!data) {

            showStatus(
              'ไม่พบผลการตรวจสอบ',
              'error'
            );

            return;
          }


          if (data.success) {

            showStatus(
              'ยืนยันตัวตนสำเร็จ',
              'success'
            );


            showResult(
              data.name || ''
            );

          } else {

            showStatus(
              data.message ||
              'ไม่พบข้อมูลที่ตรงกัน',
              'error'
            );
          }
        };


      /* -----------------------------------------
         ERROR / TIMEOUT
      ----------------------------------------- */

      script.onerror =
        function() {

          cleanup();


          showStatus(
            'ไม่สามารถเชื่อมต่อระบบตรวจสอบได้',
            'error'
          );
        };


      const timeout =
        setTimeout(function() {

          if (!finished) {

            cleanup();


            showStatus(
              'ระบบใช้เวลาตรวจสอบนานเกินไป กรุณาลองใหม่',
              'error'
            );
          }

        }, 15000);


      /* -----------------------------------------
         BUILD URL
      ----------------------------------------- */

      const url =
        GOOGLE_SCRIPT_URL +
        '?employeeId=' +
        encodeURIComponent(employeeId) +
        '&dob=' +
        encodeURIComponent(dob) +
        '&callback=' +
        encodeURIComponent(callbackName);


      /* -----------------------------------------
         SCRIPT LOAD
      ----------------------------------------- */

      script.src = url;

      script.async = true;


      /* -----------------------------------------
         APPEND
      ----------------------------------------- */

      document.body.appendChild(script);

    }


    /* =========================================
       ENTER KEY
    ========================================= */

    employeeIdInput.addEventListener(
      'keydown',
      function(event) {

        if (event.key === 'Enter') {

          event.preventDefault();

          dobInput.focus();
        }

      }
    );


    dobInput.addEventListener(
      'keydown',
      function(event) {

        if (event.key === 'Enter') {

          event.preventDefault();

          verifyEmployee();
        }

      }
    );


  </script>

</body>
</html>
