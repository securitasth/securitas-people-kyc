<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Securitas People KYC</title>


  <!-- LINE LIFF SDK -->
  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        "Noto Sans Thai",
        sans-serif;
      background: #f4f6f8;
      color: #171717;
    }


    body {
      display: flex;
      justify-content: center;
      padding: 18px 12px 40px;
    }


    .card {
      width: 100%;
      max-width: 780px;
      background: #ffffff;
      border-radius: 24px;
      padding: 38px 42px 42px;
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.08);
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .brand {
      text-align: center;
    }


    .brand-title {
      font-size: clamp(38px, 7vw, 58px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1px;
    }


    .brand-subtitle {
      margin-top: 8px;
      font-size: clamp(22px, 4vw, 30px);
      color: #68758c;
      font-weight: 400;
    }


    .line {
      width: 92%;
      height: 1px;
      background: #999;
      margin: 38px auto 42px;
    }


    /* =====================================================
       HEADING
       ===================================================== */

    .heading {
      text-align: center;
      font-size: clamp(30px, 6vw, 48px);
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 22px;
    }


    .description {
      text-align: center;
      color: #666;
      font-size: clamp(20px, 4vw, 28px);
      line-height: 1.65;
      margin-bottom: 48px;
    }


    /* =====================================================
       FORM
       ===================================================== */

    label {
      display: block;
      font-size: clamp(24px, 4.5vw, 32px);
      font-weight: 700;
      margin: 0 0 12px;
    }


    input {
      display: block;
      width: 100%;
      height: 86px;
      border: 1.5px solid #c9c9c9;
      border-radius: 20px;
      background: #ffffff;
      padding: 0 24px;
      font-size: clamp(24px, 5vw, 34px);
      color: #222;
      outline: none;
      margin-bottom: 32px;
    }


    input:focus {
      border-color: #36c84a;
      box-shadow:
        0 0 0 3px rgba(54, 200, 74, 0.12);
    }


    input[type="date"] {
      font-family: inherit;
    }


    /* =====================================================
       BUTTON
       ===================================================== */

    #verifyButton {
      display: block;
      width: 100%;
      min-height: 94px;
      border: 0;
      border-radius: 22px;
      background: #39c94a;
      color: #ffffff;
      font-size: clamp(25px, 5vw, 36px);
      font-weight: 800;
      cursor: pointer;
      padding: 18px 20px;
      margin-top: 8px;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }


    #verifyButton:active {
      transform: scale(0.98);
    }


    #verifyButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    /* =====================================================
       STATUS
       ===================================================== */

    .status {
      text-align: center;
      min-height: 42px;
      margin-top: 28px;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 700;
      line-height: 1.5;
    }


    .status.loading {
      color: #666;
    }


    .status.error {
      color: #d93025;
    }


    .status.success {
      color: #168b2d;
    }


    /* =====================================================
       RESULT
       ===================================================== */

    .result {
      display: none;
      margin-top: 28px;
      padding: 30px 24px;
      border: 3px solid #55d46a;
      border-radius: 24px;
      background: #effcf1;
      text-align: center;
    }


    .result.show {
      display: block;
    }


    .result-title {
      color: #148b2c;
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 20px;
    }


    .employee-name-label {
      font-size: clamp(21px, 4vw, 28px);
      font-weight: 600;
      margin-bottom: 8px;
    }


    .employee-name {
      font-size: clamp(27px, 5vw, 38px);
      font-weight: 800;
      line-height: 1.4;
      word-break: break-word;
    }


    .line-user-info {
      margin-top: 20px;
      color: #666;
      font-size: 14px;
      word-break: break-all;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      body {
        padding: 0;
        background: #f4f6f8;
      }


      .card {
        max-width: 100%;
        min-height: 100vh;
        border-radius: 0;
        padding:
          28px 22px
          36px;
        box-shadow: none;
      }


      .line {
        width: 90%;
        margin:
          30px auto
          34px;
      }


      .heading {
        margin-bottom: 18px;
      }


      .description {
        margin-bottom: 38px;
      }


      input {
        height: 78px;
        border-radius: 18px;
        padding: 0 20px;
        margin-bottom: 28px;
      }


      #verifyButton {
        min-height: 82px;
        border-radius: 20px;
      }


      .result {
        padding: 26px 18px;
      }
    }


    /* =====================================================
       SMALL PHONE
       ===================================================== */

    @media (max-width: 390px) {

      .card {
        padding-left: 17px;
        padding-right: 17px;
      }


      input {
        height: 72px;
      }


      #verifyButton {
        min-height: 76px;
      }
    }

  </style>

</head>


<body>


  <div class="card">


    <!-- ===================================================
         HEADER
         =================================================== -->

    <div class="brand">

      <div class="brand-title">
        Securitas People
      </div>

      <div class="brand-subtitle">
        Employee Verification
      </div>

    </div>


    <div class="line"></div>


    <!-- ===================================================
         KYC HEADING
         =================================================== -->

    <div class="heading">
      🔐 ยืนยันตัวตนพนักงาน
    </div>


    <div class="description">
      กรุณากรอกข้อมูลให้ตรงกับข้อมูลที่ลงทะเบียนไว้กับบริษัท
    </div>


    <!-- ===================================================
         EMPLOYEE ID
         =================================================== -->

    <label for="employeeId">
      Employee ID
    </label>


    <input
      id="employeeId"
      type="text"
      placeholder="เช่น TH10200146"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
    >


    <!-- ===================================================
         DATE OF BIRTH
         =================================================== -->

    <label for="dob">
      วันเดือนปีเกิด
    </label>


    <input
      id="dob"
      type="date"
      autocomplete="bday"
    >


    <!-- ===================================================
         VERIFY BUTTON
         =================================================== -->

    <button
      id="verifyButton"
      type="button"
      onclick="verifyEmployee()"
    >
      ยืนยันตัวตน / Verify Identity
    </button>


    <!-- ===================================================
         STATUS
         =================================================== -->

    <div
      id="status"
      class="status"
    ></div>


    <!-- ===================================================
         RESULT
         =================================================== -->

    <div
      id="result"
      class="result"
    >

      <div class="result-title">
        ✅ ยืนยันตัวตนสำเร็จ
      </div>


      <div class="employee-name-label">
        ชื่อพนักงาน:
      </div>


      <div
        id="employeeName"
        class="employee-name"
      ></div>


      <!-- ใช้ตรวจสอบตอนพัฒนา
           ไม่แสดง LINE User ID ต่อผู้ใช้ -->
      <div
        id="lineUserInfo"
        class="line-user-info"
        style="display:none;"
      ></div>

    </div>


  </div>



  <script>

    /********************************************************
     * CONFIGURATION
     ********************************************************/


    const LIFF_ID =
      '2011060843-6rwH2ZRD';


    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbzVYaICkM0zX5gV4B9kuQRPOrApCn6wXZnozIkH8waNPVbuaB8uLZNK_4DWhj2hwto/exec';



    /********************************************************
     * GLOBAL
     ********************************************************/

    let liffProfile = null;



    /********************************************************
     * PAGE LOAD
     ********************************************************/

    window.addEventListener(
      'load',
      initLIFF
    );



    /********************************************************
     * INITIALIZE LIFF
     ********************************************************/

    async function initLIFF() {

      setStatus(
        'กำลังเชื่อมต่อ LINE...',
        'loading'
      );


      try {

        await liff.init({
          liffId: LIFF_ID
        });


        /*
         * ถ้าเปิดจาก browser ภายนอก LINE
         * และยังไม่ได้ login
         */

        if (!liff.isLoggedIn()) {

          /*
           * ให้ผู้ใช้ Login LINE
           */

          liff.login();

          return;
        }


        /*
         * ดึง LINE Profile
         */

        liffProfile =
          await liff.getProfile();


        if (!liffProfile) {

          throw new Error(
            'ไม่สามารถอ่าน LINE Profile ได้'
          );
        }


        setStatus(
          'พร้อมยืนยันตัวตน',
          'success'
        );


      } catch (error) {

        console.error(
          'LIFF initialization error:',
          error
        );


        setStatus(
          'ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาเปิดผ่าน LINE อีกครั้ง',
          'error'
        );
      }
    }



    /********************************************************
     * VERIFY EMPLOYEE
     ********************************************************/

    function verifyEmployee() {


      const employeeId =
        document
          .getElementById('employeeId')
          .value
          .trim()
          .toUpperCase();


      const dob =
        document
          .getElementById('dob')
          .value
          .trim();


      const button =
        document
          .getElementById('verifyButton');


      const resultBox =
        document
          .getElementById('result');


      const employeeName =
        document
          .getElementById('employeeName');



      /*
       * ตรวจข้อมูล
       */

      if (!employeeId) {

        setStatus(
          'กรุณากรอก Employee ID',
          'error'
        );

        document
          .getElementById('employeeId')
          .focus();

        return;
      }


      if (!dob) {

        setStatus(
          'กรุณาเลือกวันเดือนปีเกิด',
          'error'
        );

        document
          .getElementById('dob')
          .focus();

        return;
      }



      /*
       * ตรวจ LIFF
       */

      if (!liffProfile) {

        setStatus(
          'ยังไม่ได้เชื่อมต่อ LINE กรุณารอสักครู่แล้วลองใหม่',
          'error'
        );

        return;
      }



      /*
       * LINE User ID
       */

      const userId =
        liffProfile.userId || '';


      const lineName =
        liffProfile.displayName || '';



      if (!userId) {

        setStatus(
          'ไม่พบ LINE User ID กรุณาเปิด KYC ผ่าน LINE',
          'error'
        );

        return;
      }



      /*
       * ปิดผลลัพธ์เดิม
       */

      resultBox
        .classList
        .remove('show');


      employeeName.textContent =
        '';



      /*
       * Loading
       */

      button.disabled = true;

      button.textContent =
        'กำลังตรวจสอบ...';


      setStatus(
        'กำลังตรวจสอบข้อมูล...',
        'loading'
      );



      /*
       * เรียก Google Apps Script
       */

      callGoogleAppsScript(
        employeeId,
        dob,
        userId,
        lineName,
        function(response) {

          /*
           * เปิดปุ่มกลับ
           */

          button.disabled = false;

          button.textContent =
            'ยืนยันตัวตน / Verify Identity';



          /*
           * ตรวจ response
           */

          if (!response) {

            setStatus(
              'ระบบไม่ตอบกลับ กรุณาลองใหม่อีกครั้ง',
              'error'
            );

            return;
          }



          /*
           * KYC สำเร็จ
           */

          if (response.success) {


            setStatus(
              'ยืนยันตัวตนสำเร็จ',
              'success'
            );


            employeeName.textContent =
              response.name || '';


            resultBox
              .classList
              .add('show');


            /*
             * สำหรับ debug ตอนพัฒนา
             *
             * ไม่แสดงให้ user เห็น
             */

            const lineUserInfo =
              document
                .getElementById(
                  'lineUserInfo'
                );


            lineUserInfo.textContent =
              'LINE User ID: ' +
              (response.lineUserId || '');


            /*
             * เลื่อนหน้าจอไปผลลัพธ์
             */

            setTimeout(
              function() {

                resultBox
                  .scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                  });

              },
              100
            );


            return;
          }



          /*
           * KYC ไม่ผ่าน
           */

          setStatus(
            response.message ||
            'ไม่สามารถยืนยันตัวตนได้',
            'error'
          );

        }
      );
    }



    /********************************************************
     * GOOGLE APPS SCRIPT JSONP
     ********************************************************/

    function callGoogleAppsScript(
      employeeId,
      dob,
      userId,
      lineName,
      callback
    ) {


      /*
       * สร้าง callback name ไม่ซ้ำ
       */

      const callbackName =
        'kycCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      /*
       * สร้าง global callback
       */

      window[callbackName] =
        function(response) {


          try {

            callback(response);

          } finally {

            /*
             * ลบ callback หลังใช้งาน
             */

            delete window[callbackName];

            const oldScript =
              document.getElementById(
                callbackName
              );


            if (oldScript) {

              oldScript.remove();
            }
          }
        };



      /*
       * สร้าง URL
       */

      const url =
        GAS_URL +
        '?callback=' +
        encodeURIComponent(
          callbackName
        ) +
        '&employeeId=' +
        encodeURIComponent(
          employeeId
        ) +
        '&dob=' +
        encodeURIComponent(
          dob
        ) +
        '&userId=' +
        encodeURIComponent(
          userId
        ) +
        '&lineName=' +
        encodeURIComponent(
          lineName
        );



      /*
       * สร้าง Script tag
       */

      const script =
        document.createElement(
          'script'
        );


      script.id =
        callbackName;


      script.src =
        url;


      script.async =
        true;



      /*
       * Error
       */

      script.onerror =
        function() {

          delete window[callbackName];

          script.remove();


          callback({
            success: false,
            message:
              'ไม่สามารถเชื่อมต่อระบบตรวจสอบได้'
          });
        };



      /*
       * Timeout
       */

      const timeout =
        setTimeout(
          function() {

            if (
              window[callbackName]
            ) {

              delete window[callbackName];

              script.remove();


              callback({
                success: false,
                message:
                  'ระบบตรวจสอบใช้เวลานานเกินไป กรุณาลองใหม่'
              });
            }

          },
          20000
        );



      /*
       * เมื่อ callback สำเร็จ
       * clear timeout
       */

      const originalCallback =
        window[callbackName];


      window[callbackName] =
        function(response) {

          clearTimeout(timeout);


          try {

            originalCallback(
              response
            );

          } catch (error) {

            console.error(error);

          }
        };



      /*
       * ส่ง request
       */

      document
        .body
        .appendChild(script);
    }



    /********************************************************
     * STATUS
     ********************************************************/

    function setStatus(
      message,
      type
    ) {


      const status =
        document
          .getElementById('status');


      status.textContent =
        message;


      status.className =
        'status ' +
        (type || '');
    }

  </script>

</body>

</html>
